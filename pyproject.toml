[project]
name = "faultline"
version = "0.1.0"
description = "Predictive-maintenance copilot for an industrial air compressor, on AMD Instinct MI300X"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.20",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local development only. On the droplet the rocm/pytorch image supplies torch.
train = ["torch>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faultline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["data: needs the downloaded MetroPT-3 parquet in data/"]

[tool.ruff]
line-length = 100
target-version = "py312"
